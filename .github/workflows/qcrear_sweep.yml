name: qcrear sweep

on:
  schedule:
    # Corre todos los días a las 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    # También se puede lanzar manualmente

permissions:
  contents: write

concurrency:
  group: qcrear-publish
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "qmp-bot"
          git config user.email "qmp-bot@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Write service account keyfile
        env:
          QMP_GDOCS_SA_KEY_JSON: ${{ secrets.QMP_GDOCS_SA_KEY_JSON }}
        run: |
          mkdir -p .secrets
          python - <<'PY'
          import os, pathlib
          p = pathlib.Path(".secrets/sa.json")
          p.write_text(os.environ["QMP_GDOCS_SA_KEY_JSON"], encoding="utf-8")
          print("Wrote", p)
          PY
          chmod 600 .secrets/sa.json

      - name: Write gdocs.json config
        env:
          QMP_GDOCS_CONFIG_JSON: ${{ secrets.QMP_GDOCS_CONFIG_JSON }}
        run: |
          mkdir -p ~/.config/qmp
          python - <<'PY'
          import os, pathlib
          p = pathlib.Path.home() / ".config" / "qmp" / "gdocs.json"
          p.write_text(os.environ["QMP_GDOCS_CONFIG_JSON"], encoding="utf-8")
          print("Wrote", p)
          PY

      - name: Save HEAD before sweep
        id: pre_sweep
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Run sweep
        env:
          QMP_GDOCS_SA_KEYFILE: ${{ github.workspace }}/.secrets/sa.json
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        working-directory: scripts
        run: |
          python qcrear.py --sweep --auto --yes

      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRE_SWEEP_SHA: ${{ steps.pre_sweep.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$PRE_SWEEP_SHA" ]; then
            echo "No new commit from sweep, skipping notification"
            exit 0
          fi
          NOTIFY_DATE=$(git log --name-only -1 --format="" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}\.txt$' | head -1 | sed 's/\.txt//')
          if [ -z "$NOTIFY_DATE" ]; then
            echo "No new poem in last commit, skipping notification"
            exit 0
          fi
          NOTIFY_DATE="$NOTIFY_DATE" python3 - <<'PY'
          import html, json, os, urllib.request, urllib.parse
          from pathlib import Path

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit("Telegram secrets not configured, skipping")

          date = os.environ["NOTIFY_DATE"]
          year, month, _ = date.split("-")
          txt_path = Path(f"data/textos/{year}/{month}/{date}.txt")
          if not txt_path.exists():
              raise SystemExit(f"Archivo no encontrado: {txt_path}")

          lines = txt_path.read_text(encoding="utf-8").split("\n")
          headers, sections, current, buf = {}, {}, None, []
          for line in lines:
              if line.startswith("# "):
                  if current is not None:
                      sections[current] = "\n".join(buf).strip()
                  current, buf = line[2:].strip(), []
              elif current is None:
                  k, _, v = line.partition(":")
                  if v:
                      headers[k.strip()] = v.strip()
              else:
                  buf.append(line)
          if current is not None:
              sections[current] = "\n".join(buf).strip()

          try:
              raw = json.loads(Path("data/archivo.json").read_text(encoding="utf-8"))
              entries = raw.get("entries", raw) if isinstance(raw, dict) else raw
              entry = next((e for e in entries if e.get("date") == date), None)
              keywords = [k["word"] for k in (entry or {}).get("keywords", []) if k.get("weight", 0) >= 2]
          except Exception:
              keywords = []

          def send(text):
              data = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": text,
                  "parse_mode": "HTML",
              }).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=data, method="POST"
              )
              with urllib.request.urlopen(req) as resp:
                  print(resp.read().decode())

          esc = html.escape
          title = headers.get("MY_POEM_TITLE", "").strip()
          poet = headers.get("POETA", "").strip()
          poem_title_cited = headers.get("POEM_TITLE", "").strip()
          book_title = headers.get("BOOK_TITLE", "").strip()
          poem = sections.get("POEMA", "")
          cited_poem = sections.get("POEMA_CITADO", "")
          analysis = sections.get("TEXTO", "")

          cited_lines = [l for l in cited_poem.split("\n") if l.strip()]
          cited_snippet = "\n".join(cited_lines[:5])

          # Message 1: my poem
          parts1 = [f"📖 <b>Que Mal Poema</b> — {esc(date)}"]
          if title:
              parts1.append(f"<b>{esc(title)}</b>")
          if poem:
              parts1.append(esc(poem))
          parts1.append("https://quemalpoema.com")
          msg1 = "\n\n".join(parts1)
          if len(msg1) > 4000:
              msg1 = msg1[:4000] + "…"
          send(msg1)

          # Message 2: cited poem snippet + analysis
          parts2 = []
          if poet or poem_title_cited:
              cited_header = "<i>" + esc(poem_title_cited or "")
              if poet:
                  cited_header += f" — {esc(poet)}"
              if book_title:
                  cited_header += f", {esc(book_title)}"
              cited_header += "</i>"
              parts2.append(cited_header)
          if cited_snippet:
              parts2.append(esc(cited_snippet) + "\n…")
          if analysis:
              parts2.append(esc(analysis))
          if parts2:
              msg2 = "\n\n".join(parts2)
              if len(msg2) > 4000:
                  msg2 = msg2[:4000] + "…"
              send(msg2)

          # Message 3: keywords
          if keywords:
              send("🏷 " + " · ".join(esc(k) for k in keywords))
          PY
