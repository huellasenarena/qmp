name: qcrear publish (one date)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha NO publicada (YYYY-MM-DD) — debe existir en Google Docs"
        required: true

permissions:
  contents: write

concurrency:
  group: qcrear-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "qmp-bot"
          git config user.email "qmp-bot@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Write service account keyfile
        env:
          QMP_GDOCS_SA_KEY_JSON: ${{ secrets.QMP_GDOCS_SA_KEY_JSON }}
        run: |
          mkdir -p .secrets
          python - <<'PY'
          import os, pathlib
          p = pathlib.Path(".secrets/sa.json")
          p.write_text(os.environ["QMP_GDOCS_SA_KEY_JSON"], encoding="utf-8")
          print("Wrote", p)
          PY
          chmod 600 .secrets/sa.json

      - name: Write gdocs.json config
        env:
          QMP_GDOCS_CONFIG_JSON: ${{ secrets.QMP_GDOCS_CONFIG_JSON }}
        run: |
          mkdir -p ~/.config/qmp
          python - <<'PY'
          import os, pathlib
          p = pathlib.Path.home() / ".config" / "qmp" / "gdocs.json"
          p.write_text(os.environ["QMP_GDOCS_CONFIG_JSON"], encoding="utf-8")
          print("Wrote", p)
          PY

      - name: Assert date is NOT in data/archivo.json
        env:
          DATE: ${{ inputs.date }}
        run: |
          python - <<'PY'
          import json, os
          date = os.environ["DATE"]
          with open("data/archivo.json", "r", encoding="utf-8") as f:
            archivo = json.load(f)

          def walk(obj):
            if isinstance(obj, dict):
              if obj.get("date") == date:
                return True
              return any(walk(v) for v in obj.values())
            if isinstance(obj, list):
              return any(walk(x) for x in obj)
            return False

          if walk(archivo):
            raise SystemExit(f"ERROR: {date} ya está en archivo.json (ya publicada).")
          print("OK: fecha NO publicada:", date)
          PY

      - name: Run qcrear (publish)
        env:
          QMP_GDOCS_SA_KEYFILE: ${{ github.workspace }}/.secrets/sa.json
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        working-directory: scripts
        run: |
          python qcrear.py "${{ inputs.date }}" --auto --yes

      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_DATE: ${{ inputs.date }}
        run: |
          python3 - <<'PY'
          import html, json, os, urllib.request, urllib.parse
          from pathlib import Path

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit("Telegram secrets not configured, skipping")

          date = os.environ["NOTIFY_DATE"]
          year, month, _ = date.split("-")
          txt_path = Path(f"data/textos/{year}/{month}/{date}.txt")
          if not txt_path.exists():
              raise SystemExit(f"Archivo no encontrado: {txt_path}")

          lines = txt_path.read_text(encoding="utf-8").split("\n")
          headers, sections, current, buf = {}, {}, None, []
          for line in lines:
              if line.startswith("# "):
                  if current is not None:
                      sections[current] = "\n".join(buf).strip()
                  current, buf = line[2:].strip(), []
              elif current is None:
                  k, _, v = line.partition(":")
                  if v:
                      headers[k.strip()] = v.strip()
              else:
                  buf.append(line)
          if current is not None:
              sections[current] = "\n".join(buf).strip()

          try:
              raw = json.loads(Path("data/archivo.json").read_text(encoding="utf-8"))
              entries = raw.get("entries", raw) if isinstance(raw, dict) else raw
              entry = next((e for e in entries if e.get("date") == date), None)
              keywords = [k["word"] for k in (entry or {}).get("keywords", []) if k.get("weight", 0) >= 2]
          except Exception:
              keywords = []

          esc = html.escape
          title = headers.get("MY_POEM_TITLE", "").strip()
          poet = headers.get("POETA", "").strip()
          poem_title_cited = headers.get("POEM_TITLE", "").strip()
          poem = sections.get("POEMA", "")

          parts = [f"📖 <b>Que Mal Poema</b> — {esc(date)}"]
          if title:
              parts.append(f"<b>{esc(title)}</b>")
          if poem:
              parts.append(esc(poem))
          if poet or poem_title_cited:
              cited = "<i>citado: " + esc(poem_title_cited or "")
              if poet:
                  cited += f" ({esc(poet)})"
              cited += "</i>"
              parts.append(cited)
          if keywords:
              parts.append("🏷 " + " · ".join(esc(k) for k in keywords))
          parts.append("https://quemalpoema.com")

          message = "\n\n".join(parts)
          if len(message) > 4000:
              message = message[:4000] + "…"

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "HTML",
          }).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data, method="POST"
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.read().decode())
          PY

