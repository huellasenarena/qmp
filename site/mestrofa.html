<!DOCTYPE html>
<!-- =========================
  mestrofa.html – A mí me strofa
========================= -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <script src="mestrofa.js" defer></script>
  <title>A mí me strofa</title>
</head>

<!-- Ojo: script.js se carga en todas las páginas y, al abrirse, esconde y
     enseña los bloques que se llaman poem / poemHeader / analysis /
     analysisHeader. Por eso aquí todo lleva delante "ms-". -->
<body data-page="mestrofa">
  <header>
    <nav>
      <div class="nav-left">
        <a href="../index.html">Poema du jour</a>
        <a href="../index.html?a=1">Análisis du jour</a>
        <a href="mestrofa.html" class="active">A mí me strofa</a>
        <a href="archivo.html">Archivo</a>
      </div>
      <span class="date" id="ms-fecha"></span>
    </nav>
  </header>

  <main>
    <div class="content">
      <h1 id="ms-titulo"></h1>

      <p class="ms-intro" id="ms-intro"></p>

      <!-- El poema del día (o su PDF) -->
      <div class="analysis-cited-meta" id="ms-meta" hidden>
        <div class="analysis-cited-title"></div>
        <div class="analysis-cited-source"></div>
      </div>

      <div id="ms-poema"></div>

      <!-- De qué día son los números, cuando no son de hoy -->
      <p class="ms-nota-dia" id="ms-nota-dia" hidden></p>

      <!-- Los tres números -->
      <div class="ms-cols" id="ms-duelo" hidden></div>

      <!-- "no encontré nada" y los fallos de carga -->
      <p class="ms-aviso" id="ms-aviso" hidden></p>

      <!-- El marcador suelto, para los días sin números -->
      <p class="ms-marcador-solo" id="ms-marcador-solo" hidden></p>

      <!-- La caja de texto -->
      <section class="ms-caja">
        <p class="ms-caja-intro" id="ms-caja-intro"></p>

        <textarea id="ms-texto" class="ms-textarea" rows="5" maxlength="6000"></textarea>

        <div class="ms-caja-fila">
          <button type="button" id="ms-btn" class="ms-btn"></button>
          <span class="ms-contador" id="ms-contador"></span>
        </div>

        <p class="ms-error" id="ms-error" hidden></p>

        <div class="ms-pred" id="ms-pred" hidden></div>
      </section>
    </div>
  </main>

</body>
</html>
